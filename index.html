<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>AIM TRAINER — рейтинг</title>
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#13151dcc;--line:#ffffff14;--text:#f4f6ff;--muted:#8b90a1;--accent:#ff3b5c;--green:#42f5a4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 50% -20%,#ff3b5c2e,transparent 42%),var(--bg);color:var(--text)}body{overflow:hidden}button,input{font:inherit}.app{height:100dvh;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.main{min-width:0;display:flex;flex-direction:column;gap:14px}.topbar,.leaderboard{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 14px 40px #0005}.topbar{padding:12px 18px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:24px}.logo{font-weight:950;letter-spacing:.12em;white-space:nowrap}.logo i{display:inline-block;width:14px;height:14px;margin-right:10px;border:4px solid var(--accent);border-radius:50%;box-shadow:0 0 18px #ff3b5ccc}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:5px 10px;border-left:1px solid var(--line)}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.stat strong{font-size:18px}.arena{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:22px;cursor:crosshair;user-select:none;touch-action:manipulation;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(circle,#171922,#090a0e 70%);background-size:42px 42px,42px 42px,auto;box-shadow:inset 0 0 80px #0007}.target{--size:64px;position:absolute;z-index:5;display:none;width:var(--size);height:var(--size);border:0;border-radius:50%;cursor:crosshair;background:radial-gradient(circle,#fff 0 10%,#ffbbc6 11% 22%,var(--accent) 23% 52%,#a90c2b 53% 67%,#ff5b77 68%);box-shadow:0 0 0 5px #ff3b5c1f,0 0 30px #ff3b5ccc;animation:pop .12s ease-out}.target.visible{display:block}@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}.overlay{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:#04050899;backdrop-filter:blur(7px)}.overlay.hidden{display:none}.menu{width:min(500px,100%);padding:34px;text-align:center;border:1px solid #ffffff1a;border-radius:25px;background:linear-gradient(145deg,#1e202bf5,#0e0f15f5);box-shadow:0 24px 90px #0009}.eyebrow{color:#ff758b;font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.menu h1{margin:12px 0;font-size:clamp(38px,7vw,68px);line-height:.94;letter-spacing:-.06em}.menu p{color:var(--muted);line-height:1.55}.name-row{display:flex;gap:8px;margin:18px 0}.name-row input{min-width:0;flex:1;padding:14px;border:1px solid var(--line);border-radius:13px;background:#ffffff0a;color:var(--text);outline:none}.btn{border:0;border-radius:13px;padding:14px 18px;color:#fff;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--accent),#c20d3a)}.btn.secondary{background:#ffffff12;border:1px solid var(--line)}.result{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.result.show{display:grid}.result div{padding:13px 6px;border:1px solid var(--line);border-radius:12px;background:#ffffff08}.result strong,.result span{display:block}.result span{color:var(--muted);font-size:9px;text-transform:uppercase}.leaderboard{min-height:0;padding:18px;display:flex;flex-direction:column}.leaderboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.leaderboard h2{margin:0;font-size:24px}.status{margin:5px 0 14px;color:var(--muted);font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.tab{padding:10px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:var(--muted);cursor:pointer;font-weight:800}.tab.active{background:#ff3b5c22;color:#fff;border-color:#ff3b5c55}.scores{min-height:0;overflow:auto;display:grid;gap:7px}.score{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#ffffff07}.score.me{border-color:#42f5a455;background:#42f5a40d}.rank{font-weight:950;color:#ffb4c0}.player{min-width:0}.player strong,.player small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player small{color:var(--muted);font-size:10px}.points{text-align:right;font-weight:950}.empty{padding:24px 10px;text-align:center;color:var(--muted)}.miss{position:absolute;width:22px;height:22px;pointer-events:none;transform:translate(-50%,-50%);animation:fade .4s forwards}.miss:before,.miss:after{content:"";position:absolute;top:10px;width:22px;height:2px;background:#fff9}.miss:before{transform:rotate(45deg)}.miss:after{transform:rotate(-45deg)}@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100dvh;grid-template-columns:1fr}.main{height:78dvh}.leaderboard{min-height:420px}.topbar{grid-template-columns:1fr}.logo{text-align:center}.stats{grid-template-columns:repeat(5,1fr)}.stat{text-align:center;border:0;padding:2px}.stat strong{font-size:15px}}
@media(max-width:520px){.app{padding:8px;gap:8px}.topbar{padding:10px}.stats{grid-template-columns:repeat(3,1fr)}.stats .stat:nth-child(4),.stats .stat:nth-child(5){grid-column:span 1}.menu{padding:25px 18px}.name-row{flex-direction:column}}
</style>
<script src="config.js?v=1.2.1" defer></script>
</head>
<body>
<div class="app">
<section class="main">
<header class="topbar"><div class="logo"><i></i>AIM TRAINER</div><div class="stats">
<div class="stat"><span>Время</span><strong id="time">30.0</strong></div><div class="stat"><span>Попадания</span><strong id="hits">0</strong></div><div class="stat"><span>Промахи</span><strong id="misses">0</strong></div><div class="stat"><span>Точность</span><strong id="accuracy">100%</strong></div><div class="stat"><span>Реакция</span><strong id="reaction">—</strong></div>
</div></header>
<div class="arena" id="arena"><button class="target" id="target" aria-label="Цель"></button>
<div class="overlay" id="overlay"><div class="menu"><div class="eyebrow" id="eyebrow">Тренировка реакции</div><h1 id="title">AIM<br>TRAINER</h1><p id="description">Нажимай на цели как можно быстрее. Раунд длится 30 секунд, клик по пустому месту считается промахом.</p><div class="result" id="result"><div><strong id="rHits">0</strong><span>Целей</span></div><div><strong id="rAccuracy">0%</strong><span>Точность</span></div><div><strong id="rReaction">—</strong><span>Реакция</span></div></div><div class="name-row"><input id="playerName" maxlength="20" placeholder="Введите ник"><button class="btn" id="start">Начать</button></div></div></div>
</div></section>
<aside class="leaderboard"><div class="leaderboard-head"><div><div class="eyebrow">Таблица лидеров</div><h2>Рейтинг</h2></div><button class="btn secondary" id="refresh">↻</button></div><div class="status" id="status">Загрузка результатов…</div><div class="tabs"><button class="tab active" data-tab="global">Общий</button><button class="tab" data-tab="local">На устройстве</button></div><div class="scores" id="scores"></div></aside>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),arena=$('arena'),target=$('target'),overlay=$('overlay'),start=$('start'),nameInput=$('playerName'),scores=$('scores'),statusEl=$('status');
const DURATION=30000,LOCAL_KEY='aimTrainerScoresV2';let running=false,hits=0,misses=0,reactions=[],spawnAt=0,endAt=0,raf=0,timer=0,currentTab='global';
nameInput.value=localStorage.getItem('aimTrainerName')||'';
const cfg=()=>window.AIM_CONFIG||{};const onlineReady=()=>Boolean(cfg().supabaseUrl&&cfg().supabaseAnonKey&&!cfg().supabaseUrl.includes('YOUR_'));
function avg(){return reactions.length?Math.round(reactions.reduce((a,b)=>a+b,0)/reactions.length):null}function acc(){const n=hits+misses;return n?Math.round(hits/n*100):100}
function stats(ms=DURATION){$('time').textContent=(Math.max(0,ms)/1000).toFixed(1);$('hits').textContent=hits;$('misses').textContent=misses;$('accuracy').textContent=acc()+'%';$('reaction').textContent=avg()===null?'—':avg()+' мс'}
function hide(){target.classList.remove('visible')}function schedule(){clearTimeout(timer);hide();if(!running)return;timer=setTimeout(show,120+Math.random()*300)}
function show(){if(!running)return;const r=arena.getBoundingClientRect(),s=Math.round(48+Math.random()*24),p=12;target.style.setProperty('--size',s+'px');target.style.left=(p+Math.random()*Math.max(1,r.width-s-p*2))+'px';target.style.top=(p+Math.random()*Math.max(1,r.height-s-p*2))+'px';spawnAt=performance.now();target.classList.add('visible')}
function tick(){if(!running)return;const left=endAt-performance.now();stats(left);if(left<=0)return finish();raf=requestAnimationFrame(tick)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function begin(){const name=nameInput.value.trim().slice(0,20);if(!name){nameInput.focus();nameInput.style.borderColor='#ff3b5c';return}localStorage.setItem('aimTrainerName',name);start.disabled=true;hits=misses=0;reactions=[];stats();$('result').classList.remove('show');$('eyebrow').textContent='Приготовься';$('description').textContent='Цели появятся после обратного отсчёта.';for(let n=3;n>0;n--){$('title').textContent=n;await sleep(600)}$('title').textContent='GO!';await sleep(300);overlay.classList.add('hidden');running=true;endAt=performance.now()+DURATION;schedule();tick()}
async function finish(){running=false;clearTimeout(timer);cancelAnimationFrame(raf);hide();stats(0);const entry={name:nameInput.value.trim(),score:hits,accuracy:acc(),reaction:avg()||9999,created_at:new Date().toISOString()};saveLocal(entry);await saveOnline(entry);$('rHits').textContent=hits;$('rAccuracy').textContent=acc()+'%';$('rReaction').textContent=avg()===null?'—':avg()+' мс';$('eyebrow').textContent='Раунд завершён';$('title').innerHTML=hits+'<br>ЦЕЛЕЙ';$('description').textContent='Результат добавлен в рейтинг. Попробуй улучшить его.';$('result').classList.add('show');start.textContent='Играть ещё';start.disabled=false;overlay.classList.remove('hidden');loadScores()}
function saveLocal(e){const list=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');list.push(e);list.sort(sortScores);localStorage.setItem(LOCAL_KEY,JSON.stringify(list.slice(0,50)))}function sortScores(a,b){return b.score-a.score||a.reaction-b.reaction||b.accuracy-a.accuracy}
async function saveOnline(e){if(!onlineReady())return;try{await fetch(cfg().supabaseUrl+'/rest/v1/aim_scores',{method:'POST',headers:{apikey:cfg().supabaseAnonKey,Authorization:'Bearer '+cfg().supabaseAnonKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(e)})}catch(err){console.warn('Не удалось сохранить онлайн-рейтинг',err)}}
async function getOnline(){if(!onlineReady())return null;const url=cfg().supabaseUrl+'/rest/v1/aim_scores?select=name,score,accuracy,reaction,created_at&order=score.desc,reaction.asc&limit=50';const r=await fetch(url,{headers:{apikey:cfg().supabaseAnonKey,Authorization:'Bearer '+cfg().supabaseAnonKey}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function render(list){scores.innerHTML='';if(!list.length){scores.innerHTML='<div class="empty">Результатов пока нет</div>';return}const me=localStorage.getItem('aimTrainerName');list.slice(0,50).forEach((e,i)=>{const row=document.createElement('div');row.className='score'+(e.name===me?' me':'');row.innerHTML='<div class="rank">'+(i+1)+'</div><div class="player"><strong></strong><small>'+e.accuracy+'% · '+(e.reaction===9999?'—':e.reaction+' мс')+'</small></div><div class="points">'+e.score+'</div>';row.querySelector('strong').textContent=e.name; scores.appendChild(row)})}
async function loadScores(){statusEl.textContent='Обновление…';if(currentTab==='local'){const list=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]').sort(sortScores);render(list);statusEl.textContent='Результаты сохранены только в этом браузере';return}try{const list=await getOnline();if(list===null){render(JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]').sort(sortScores));statusEl.textContent='Онлайн-рейтинг не подключён — показан локальный топ';return}render(list);statusEl.textContent='Общий рейтинг игроков'}catch(e){render(JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]').sort(sortScores));statusEl.textContent='Ошибка соединения — показан локальный топ'}}
target.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!running||!target.classList.contains('visible'))return;hits++;reactions.push(performance.now()-spawnAt);stats(endAt-performance.now());schedule()});arena.addEventListener('pointerdown',e=>{if(!running)return;misses++;const m=document.createElement('i');m.className='miss';const r=arena.getBoundingClientRect();m.style.left=e.clientX-r.left+'px';m.style.top=e.clientY-r.top+'px';arena.appendChild(m);setTimeout(()=>m.remove(),450);stats(endAt-performance.now())});start.addEventListener('click',begin);$('refresh').addEventListener('click',loadScores);document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTab=b.dataset.tab;loadScores()}));stats();loadScores();
</script>
</body></html>
